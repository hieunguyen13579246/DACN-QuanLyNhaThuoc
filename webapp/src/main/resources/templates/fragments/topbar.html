<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar(pageTitle)" class="app-topbar">
    <div class="d-flex align-items-center gap-2">
        <span class="fw-bold fs-6 text-dark" th:text="${pageTitle ?: 'Hệ thống Quản lý Chuỗi Nhà thuốc IS009'}">Tiêu đề</span>
    </div>
    <div class="d-flex align-items-center gap-3" th:if="${nguoiDungHienTai != null}">
        <span class="badge bg-light text-dark border px-2 py-1">
            Nhà thuốc:
            <strong th:text="${tenNhaThuocHienTai}">Toàn chuỗi</strong>
            <span th:if="${maNhaThuocHienTai != null}" th:text="'(' + ${maNhaThuocHienTai} + ')'"></span>
        </span>
        <span class="badge bg-primary" th:text="${tenVaiTroHienTai}">Vai trò</span>
        <span class="small fw-semibold text-dark" th:text="${hoTenHienTai}">Nguyễn Văn A</span>
        <form th:action="@{/auth/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-secondary">Đăng xuất</button>
        </form>
    </div>
</header>
</body>
</html>
