<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout('403 - Không có quyền truy cập', ~{::section}, null)}">
<body>
<section>
    <div class="card p-4 mx-auto" style="max-width: 600px;">
        <h5 class="text-danger fw-bold mb-2">403 – Từ chối truy cập (Mã lỗi: <span th:text="${maLoi ?: '50011'}">50011</span>)</h5>
        <p class="mb-2" th:text="${thongBaoLoi ?: 'Bạn không có quyền truy cập màn hình hoặc dữ liệu nhà thuốc này (BR13).'}"></p>
        <div class="alert alert-warning py-2 small mb-3">
            <strong>Cách khắc phục:</strong>
            <span th:text="${huongDanSua ?: 'Quay lại Trang chủ hoặc đăng nhập bằng tài khoản có vai trò và phạm vi nhà thuốc phù hợp.'}"></span>
        </div>
        <div>
            <a th:href="@{/}" class="btn btn-primary btn-sm">Về Trang chủ</a>
        </div>
    </div>
</section>
</body>
</html>
