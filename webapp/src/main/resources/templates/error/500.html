<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout('Thông báo lỗi xử lý', ~{::section}, null)}">
<body>
<section>
    <div class="card p-4 mx-auto" style="max-width: 640px;">
        <h5 class="text-danger fw-bold mb-2">
            Không thể hoàn tất thao tác
            <span th:if="${maLoi != null}" class="badge bg-danger ms-1" th:text="${maLoi}"></span>
        </h5>
        <p class="mb-2" th:text="${thongBaoLoi ?: 'Đã xảy ra lỗi trong quá trình xử lý yêu cầu.'}"></p>
        <div class="alert alert-warning py-2 small mb-3">
            <strong>Cách khắc phục:</strong>
            <span th:text="${huongDanSua ?: 'Vui lòng kiểm tra lại dữ liệu đầu vào và thử lại.'}"></span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-primary btn-sm">Về Trang chủ</a>
        </div>
    </div>
</section>
</body>
</html>
